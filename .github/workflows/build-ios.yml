name: Build iOS IPA & Publish

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build StudyPlug iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode Environment
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run bundle

      - name: Copy Web Assets to Capacitor iOS
        run: |
          mkdir -p ios/App/App/public
          cp -R dist/* ios/App/App/public/
          node -e 'const fs=require("fs"); fs.writeFileSync("ios/App/App/capacitor.config.json", JSON.stringify({appId:"com.studyplug.app",appName:"StudyPlug",webDir:"public",packageClassList:[]}, null, 2));'
          echo "Web assets successfully placed in iOS container:"
          ls -lh ios/App/App/public

      - name: Build iOS App
        run: |
          mkdir -p build
          echo "=== Discovered Schemes ==="
          xcodebuild -project ios/App/App.xcodeproj -list
          
          echo "=== Attempting Build: Physical Device (Ad-Hoc) ==="
          if xcodebuild -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/DerivedData \
              build \
              CODE_SIGN_IDENTITY="-" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=YES \
              AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee xcodebuild.log; then
            echo "Physical device build succeeded!"
          else
            echo "=== Attempting Build: Physical Device (Unsigned) ==="
            if xcodebuild -project ios/App/App.xcodeproj \
                -scheme App \
                -configuration Release \
                -destination 'generic/platform=iOS' \
                -derivedDataPath build/DerivedData \
                build \
                CODE_SIGNING_ALLOWED=NO \
                CODE_SIGNING_REQUIRED=NO \
                CODE_SIGN_IDENTITY="" 2>&1 | tee -a xcodebuild.log; then
              echo "Physical device unsigned build succeeded!"
            else
              echo "=== Attempting Build: Simulator Package ==="
              if xcodebuild -project ios/App/App.xcodeproj \
                  -scheme App \
                  -configuration Release \
                  -destination 'generic/platform=iOS Simulator' \
                  -derivedDataPath build/DerivedData \
                  build 2>&1 | tee -a xcodebuild.log; then
                echo "Simulator package build succeeded!"
              else
                echo "=== ❌ ALL BUILD TIERS FAILED ==="
                tail -n 60 xcodebuild.log
                ERR_MSG=$(tail -n 40 xcodebuild.log | tr '\n' ' ' | sed 's/"/\\"/g')
                curl -s -X POST \
                  -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  -H "Accept: application/vnd.github.v3+json" \
                  https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments \
                  -d "{\"body\": \"### ❌ Xcode Build Error\n\`\`\`\n$ERR_MSG\n\`\`\`\"}" || true
                exit 1
              fi
            fi
          fi

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-failure-log
          path: xcodebuild.log

      - name: Package App into .IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "App.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: App.app not found in build directory"
            find build -maxdepth 4
            exit 1
          fi
          echo "Found App.app at: $APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r -q StudyPlug.ipa Payload
          ls -lh StudyPlug.ipa

      - name: Deploy IPA to studyplug.com.ng (Optional)
        env:
          CPANEL_USER: ${{ secrets.CPANEL_USER }}
          CPANEL_PASS: ${{ secrets.CPANEL_PASS }}
        run: |
          node upload_ipa.cjs build/StudyPlug.ipa
        continue-on-error: true

      - name: Upload IPA as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyPlug-iOS-ipa
          path: build/StudyPlug.ipa
          retention-days: 30
