name: Build iOS IPA & Publish

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios:
    name: Build StudyPlug iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run bundle

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Archive (Unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package App into .IPA
        run: |
          mkdir -p build/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r -q StudyPlug.ipa Payload
          ls -lh StudyPlug.ipa

      - name: Deploy IPA to studyplug.com.ng
        run: |
          node upload_ipa.cjs build/StudyPlug.ipa
        continue-on-error: true

      - name: Upload IPA as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyPlug-iOS-ipa
          path: build/StudyPlug.ipa
          retention-days: 30
